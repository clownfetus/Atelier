name: Build and verify release candidate
on:
  push:
    branches: ['codex/release-*', 'release/*-candidate']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned Windows compiler and build environment
        shell: pwsh
        run: |
          ./scripts/bootstrap_windows.ps1 -Python (Get-Command python).Source -ToolchainDir "$env:RUNNER_TEMP/AtelierToolchain" -InstallWebView2
          "ISCC=$env:ISCC" >> $env:GITHUB_ENV
          "$PWD/.venv-build/Scripts" >> $env:GITHUB_PATH
          & ./.venv-build/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ATELIER_VERSION=$((Get-Content version -Raw).Trim())" >> $env:GITHUB_ENV
      - run: python tests/run_checks.py --report-dir reports/backend
      - run: python -m playwright install chromium
      - run: python tests/browser_smoke.py --report-dir reports/browser
      - run: python scripts/release_inputs.py
      - name: Stage the Skin Swapper template from encrypted release inputs
        shell: pwsh
        env:
          GALACTA_UASSET: ${{ secrets.GALACTA_TEMPLATE_UASSET_B64 }}
          GALACTA_UEXP: ${{ secrets.GALACTA_TEMPLATE_UEXP_B64 }}
        run: |
          if (-not $env:GALACTA_UASSET -or -not $env:GALACTA_UEXP) {
            throw "The complete Skin Swapper template pair is required for this release."
          }
          New-Item -ItemType Directory -Force Tools/Galacta | Out-Null
          [IO.File]::WriteAllBytes("$PWD/Tools/Galacta/GAL_ConfigTemplate.uasset", [Convert]::FromBase64String($env:GALACTA_UASSET))
          [IO.File]::WriteAllBytes("$PWD/Tools/Galacta/GAL_ConfigTemplate.uexp", [Convert]::FromBase64String($env:GALACTA_UEXP))
      - run: python -m PyInstaller --noconfirm --clean Atelier.spec
      - run: python scripts/stage_tools.py --platform windows
      - run: python scripts/release_manifest.py
      - name: Compile installer
        shell: pwsh
        run: |
          $version = (Get-Content version -Raw).Trim()
          & $env:ISCC Atelier.iss "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_manifest.py --manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the frozen WebView2 application
        run: python tests/frozen_smoke.py --exe dist/Atelier/Atelier.exe --report-dir reports/frozen --viewer-checks --viewer-followups --roster-checks
      - name: Archive the verified portable payload
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Atelier -DestinationPath "dist/Atelier-Windows-$env:ATELIER_VERSION.zip"
          python scripts/verify_portable.py --archive "dist/Atelier-Windows-$env:ATELIER_VERSION.zip" --manifest dist/installer-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-portable
          path: dist/Atelier-Windows-${{ env.ATELIER_VERSION }}.zip
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: |
            dist/AtelierSetup.exe
            dist/installer-manifest.json
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-backend-report
          path: reports
  installer:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ATELIER_DISPOSABLE_INSTALLER_TEST: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installer
          path: ${{ runner.temp }}/candidate
      - run: python -m pip install playwright==1.64.0
      - name: Verify clean install, running upgrade, reinstall and uninstall
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP/candidate/installer-manifest.json" -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $manifest.previous_installer_url -OutFile "$env:RUNNER_TEMP/previous.exe"
          python tests/installer_smoke.py --installer "$env:RUNNER_TEMP/candidate/AtelierSetup.exe" --previous-installer "$env:RUNNER_TEMP/previous.exe" --previous-sha256 $manifest.previous_installer_sha256 --payload-manifest "$env:RUNNER_TEMP/candidate/installer-manifest.json" --report-dir "$env:RUNNER_TEMP/installer-report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-report-${{ matrix.os }}
          path: ${{ runner.temp }}/installer-report
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-webkit2-4.1 xvfb dbus-x11 openbox scrot xdotool python3-pyatspi at-spi2-core
      - run: python3 -m venv --system-site-packages .venv
      - run: .venv/bin/python -m pip install -r requirements-build.txt
      - run: .venv/bin/python tests/run_checks.py --report-dir reports/backend
      - run: .venv/bin/python scripts/release_inputs.py
      - name: Stage the Skin Swapper template from encrypted release inputs
        shell: bash
        env:
          GALACTA_UASSET: ${{ secrets.GALACTA_TEMPLATE_UASSET_B64 }}
          GALACTA_UEXP: ${{ secrets.GALACTA_TEMPLATE_UEXP_B64 }}
        run: |
          if [ -z "$GALACTA_UASSET" ] || [ -z "$GALACTA_UEXP" ]; then
            echo "The complete Skin Swapper template pair is required for this release." >&2
            exit 1
          fi
          mkdir -p Tools/Galacta
          printf '%s' "$GALACTA_UASSET" | base64 -d > Tools/Galacta/GAL_ConfigTemplate.uasset
          printf '%s' "$GALACTA_UEXP" | base64 -d > Tools/Galacta/GAL_ConfigTemplate.uexp
      - run: bash linux/build_appimage.sh
      - run: .venv/bin/python scripts/release_manifest.py
      - name: Verify native AppImage, WebKit setup and upgrade preservation
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          xvfb-run -a dbus-run-session -- bash -c '
            openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
            export GTK_MODULES=gail:atk-bridge NO_AT_BRIDGE=0
            .venv/bin/python tests/linux_appimage_smoke.py --appimage "dist/Atelier-'"$version"'-x86_64.AppImage" --source "$PWD" --previous-appimage "$RUNNER_TEMP/atelier-previous.AppImage" --report-dir "$RUNNER_TEMP/appimage-smoke"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-appimage
          path: dist/Atelier-*-x86_64.AppImage
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-reports
          path: |
            reports
            ${{ runner.temp }}/appimage-smoke/*.json
            ${{ runner.temp }}/appimage-smoke/*.jsonl
            ${{ runner.temp }}/appimage-smoke/*.log
            ${{ runner.temp }}/appimage-smoke/*.txt
            ${{ runner.temp }}/appimage-smoke/*.png
  bundle:
    needs: [windows, installer, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/candidate-artifacts
      - name: Assemble verified Windows, Linux and matching source assets
        run: python scripts/release_bundle.py --artifacts "$RUNNER_TEMP/candidate-artifacts" --output "$RUNNER_TEMP/release"
      - name: Read release version
        run: echo "ATELIER_VERSION=$(tr -d '[:space:]' < version)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Atelier-${{ env.ATELIER_VERSION }}-release
          path: ${{ runner.temp }}/release
          compression-level: 0
          if-no-files-found: error

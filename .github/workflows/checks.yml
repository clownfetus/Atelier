name: Checks
# Fast gate for every pull request and push to main: backend suites on the pinned Python,
# JavaScript syntax, and toolchain consistency (the lockfile parses, every release-sourced tool
# still downloads to its pinned hash, and toolchain/channel.json matches the lockfile).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.15'
  PYTHONUTF8: '1'
jobs:
  backend:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/run_checks.py --report-dir reports/backend
      - run: node --check gui/app.js && node --check gui/viewport.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-report
          path: reports
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Released tools still match their pinned hashes (both platforms)
        run: |
          python scripts/toolchain.py fetch --platform windows --dest "$RUNNER_TEMP/tools-windows"
          python scripts/toolchain.py fetch --platform linux --dest "$RUNNER_TEMP/tools-linux"
      - name: The update channel is generated from the lockfile
        run: |
          python scripts/toolchain.py channel --out "$RUNNER_TEMP/channel.json"
          diff -u toolchain/channel.json "$RUNNER_TEMP/channel.json"

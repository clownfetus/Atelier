name: Windows installer verification

on:
  push:
    branches: [codex/isolated-installer-verification]
    paths:
      - .github/workflows/windows-installer.yml
      - tests/installer_smoke.py
      - tests/fixtures/installer/**
      - Atelier.iss
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Install and upgrade (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ATELIER_DISPOSABLE_INSTALLER_TEST: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CDP test client
        run: python -m pip install --disable-pip-version-check playwright==1.64.0
      - name: Record existing WebView2 runtime
        shell: pwsh
        run: |
          $clients = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*'
          )
          $runtime = @(Get-ItemProperty -Path $clients -ErrorAction SilentlyContinue |
            Where-Object { $_.name -like '*WebView2*' } | Select-Object name, pv, PSPath)
          @{ runtimes = $runtime; runner = '${{ matrix.os }}'; installed_by_test = $false } |
            ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/webview2-runtime.json"
          Get-Content "$env:RUNNER_TEMP/webview2-runtime.json"
      - name: Download and verify the exact published installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content tests/fixtures/installer/cachefix-200d395.json -Raw | ConvertFrom-Json
          $downloads = Join-Path $env:RUNNER_TEMP 'atelier-downloads'
          New-Item -ItemType Directory -Path $downloads | Out-Null
          $items = @(
            @{ name = 'candidate.exe'; url = $manifest.installer_url; sha = $manifest.installer_sha256; bytes = $manifest.installer_bytes },
            @{ name = 'previous.exe'; url = $manifest.previous_installer_url; sha = $manifest.previous_installer_sha256; bytes = $manifest.previous_installer_bytes }
          )
          foreach ($item in $items) {
            $target = Join-Path $downloads $item.name
            Invoke-WebRequest -Uri $item.url -OutFile $target -MaximumRetryCount 3 -RetryIntervalSec 3
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $item.sha -or (Get-Item -LiteralPath $target).Length -ne $item.bytes) {
              throw "Published installer verification failed: $($item.name)"
            }
            Write-Host "$($item.name) SHA256 $actual"
          }
      - name: Verify clean install, running upgrade, reinstall and uninstall
        shell: pwsh
        run: |
          $manifest = Get-Content tests/fixtures/installer/cachefix-200d395.json -Raw | ConvertFrom-Json
          python tests/installer_smoke.py `
            --installer "$env:RUNNER_TEMP/atelier-downloads/candidate.exe" `
            --previous-installer "$env:RUNNER_TEMP/atelier-downloads/previous.exe" `
            --previous-sha256 $manifest.previous_installer_sha256 `
            --payload-manifest tests/fixtures/installer/cachefix-200d395.json `
            --report-dir "$env:RUNNER_TEMP/atelier-installer-report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect fixture-only diagnostics
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'atelier-installer-report'
          if (Test-Path -LiteralPath $report) {
            Copy-Item -LiteralPath "$env:RUNNER_TEMP/webview2-runtime.json" -Destination $report
            Get-CimInstance Win32_OperatingSystem |
              Select-Object Caption, Version, BuildNumber |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $report 'windows.json')
            Get-Process Atelier, msedgewebview2 -ErrorAction SilentlyContinue |
              Select-Object ProcessName, Id, Path |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $report 'processes.json')
          }
          exit 0
      - name: Preserve results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-verification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/atelier-installer-report/*.json
            ${{ runner.temp }}/atelier-installer-report/*.jsonl
            ${{ runner.temp }}/atelier-installer-report/*.log
            ${{ runner.temp }}/atelier-installer-report/*.png
            ${{ runner.temp }}/atelier-installer-report/*/_logs/*.txt
          if-no-files-found: warn
          retention-days: 30

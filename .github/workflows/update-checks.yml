name: Verify release updater

on:
  pull_request:
    paths:
      - 'atelier/update*.py'
      - 'scripts/*release*.py'
      - 'scripts/*update*.py'
      - 'tests/test_updates.py'
      - 'tests/test_release_pipeline.py'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/update-checks.yml'
      - 'update_keys.json'
  push:
    branches: [codex/automatic-releases]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify release]')
    needs: updater
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: '1.1.4'
      verify_only: true
      publish: false
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - run: python -m pip install cryptography==50.0.2 pyinstaller==6.22.3
      - run: python tests/test_updates.py
      - run: python tests/test_release_pipeline.py
      - run: python scripts/build_update_helper.py
      - name: Check packaged updater entry point
        run: python -c "import os,subprocess; from pathlib import Path; exe=Path('build/updater/AtelierUpdater'+('.exe' if os.name=='nt' else '')); subprocess.run([str(exe.resolve()),'--help'],check=True)"
